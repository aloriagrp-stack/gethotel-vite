name: Deploy to CPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Frontend
        working-directory: ./GetHotel frontend
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          npm install
          npm run build

      - name: Install Backend Dependencies
        working-directory: ./GetHotel backend
        run: npm install --production

      - name: ZIP Frontend Build
        run: |
          cd "GetHotel frontend"
          zip -r ../frontend_build.zip .next public package.json next.config.js
          
      - name: Upload Frontend ZIP via cURL
        run: |
          curl -T frontend_build.zip ftp://103.108.220.145/ --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" --ftp-create-dirs

      - name: Deploy and Restart Everything via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            # 1. Update Backend
            cd ~/gethotel_backend
            git fetch --all
            git reset --hard origin/main
            mkdir -p tmp && touch tmp/restart.txt
            
            # 2. Update Frontend (Website)
            cd ~/
            unzip -o frontend_build.zip -d gethotel_app/
            rm frontend_build.zip
            cd gethotel_app
            mkdir -p tmp && touch tmp/restart.txt
            echo "Both Frontend and Backend updated successfully!"
