name: Deploy GetHotelStays to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Build Frontend
        run: |
          cd GetHotel-Vite
          npm install
          npm run build

      - name: Force Upload AI Backend Files (fix missing routes)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Force uploading AI controller and routes files..."
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER" -e "set ftp:ssl-allow no; set ftp:passive-mode yes; set net:timeout 60; set net:max-retries 3; put \"GetHotel backend/routes/aiRoutes.js\" -o ./gethotel_backend/routes/aiRoutes.js; put \"GetHotel backend/controllers/aiController.js\" -o ./gethotel_backend/controllers/aiController.js; put \"GetHotel backend/server.js\" -o ./gethotel_backend/server.js; bye"
          echo "AI files uploaded successfully!"

      - name: Deploy Backend via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          if ! git diff --name-only HEAD~1 HEAD > files.txt 2>/dev/null; then
            git diff --name-only HEAD > files.txt 2>/dev/null || echo "server.js" > files.txt
          fi
          echo "Changed files:"
          cat files.txt

          while IFS= read -r FILE; do
            if [ -z "$FILE" ]; then
              continue
            fi
            if echo "$FILE" | grep -qE '(\.git|\.github|node_modules|\.env$|\.zip$|\.log$|scratch)'; then
              echo "Skipping excluded: $FILE"
              continue
            fi

            if [[ "$FILE" =~ ^"GetHotel backend/" ]]; then
              if [ -f "$FILE" ]; then
                REL_PATH=${FILE#"GetHotel backend/"}
                DIR_NAME=$(dirname "$REL_PATH")
                BASE_NAME=$(basename "$REL_PATH")

                if [ "$DIR_NAME" = "." ]; then
                  REMOTE_DIR="./gethotel_backend"
                else
                  REMOTE_DIR="./gethotel_backend/$DIR_NAME"
                fi

                echo "Uploading: $FILE -> $REMOTE_DIR/$BASE_NAME"
                lftp -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER" -e "set ftp:ssl-allow no; set ftp:passive-mode yes; set net:timeout 60; set net:max-retries 2; put \"$FILE\" -o \"$REMOTE_DIR/$BASE_NAME\"; bye"
              fi
            fi
          done < files.txt

      - name: Zip Frontend Build
        run: |
          cd GetHotel-Vite/dist
          zip -r ../../frontend.zip .
          cd ../..

      - name: Deploy Frontend Zip to cPanel
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER" -e "set ftp:ssl-allow no; set ftp:passive-mode yes; set net:timeout 60; set net:max-retries 2; put frontend.zip -o ./public_html/frontend.zip; put unzip.php -o ./public_html/unzip.php; put set_env.php -o ./public_html/set_env.php; bye"

      - name: Trigger Remote Extraction & Env Update
        run: |
          echo "Updating live .env configurations..."
          ENV_RESPONSE=$(curl -sS --max-time 30 https://gethotelstays.com/set_env.php)
          echo "Env Update Response: $ENV_RESPONSE"

          echo "Triggering remote extraction..."
          RESPONSE=$(curl -sS --max-time 30 https://gethotelstays.com/unzip.php)
          echo "Server Response: $RESPONSE"
          if [ "$RESPONSE" != "DEPLOYS_SUCCESS" ]; then
              echo "Error: Remote extraction failed or timed out. Checking if files exist."
              exit 1
          fi
          echo "Remote extraction completed successfully!"

      - name: Finalize
        run: echo "Deployment and Env updates completed successfully!"
