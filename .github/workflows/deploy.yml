name: Deploy GetHotelStays to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Build Main Frontend
        run: |
          cd GetHotel-Vite
          npm install
          npm run build

      - name: Build AI Chat Frontend
        run: |
          cd ai.gethotelstays.com
          npm install
          npm run build

      - name: Deploy Backend Zip to cPanel
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Zipping backend directory..."
          rm -f backend.zip
          cd "GetHotel backend"
          zip -r ../backend.zip server.js package.json routes controllers config middleware prisma utils -x "*.log" -x "node_modules/*" -x "uploads/*" -x "scratch/*" -x "tmp/*"
          cd ..
          ls -la backend.zip
          echo "Uploading backend.zip to public_html..."
          for i in {1..5}; do
            lftp -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER" -e "set ftp:ssl-allow no; set ftp:passive-mode yes; set net:timeout 120; set net:max-retries 10; set net:reconnect-interval-base 3; set ftp:prefer-epsv false; put backend.zip -o ./public_html/backend.zip; bye" && break || {
              echo "FTP upload failed (attempt $i/5). Retrying in 5 seconds..."
              sleep 5
            }
          done
          echo "Backend zip uploaded successfully."

      - name: Zip Main Frontend Build
        run: |
          cd GetHotel-Vite/dist/client
          zip -r ../../../frontend.zip .
          cd ../../..

      - name: Deploy Main Frontend Zip to cPanel
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          for i in {1..5}; do
            lftp -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER" -e "set ftp:ssl-allow no; set ftp:passive-mode yes; set net:timeout 120; set net:max-retries 10; set net:reconnect-interval-base 3; set ftp:prefer-epsv false; put frontend.zip -o ./public_html/frontend.zip; put unzip.php -o ./public_html/unzip.php; put set_env.php -o ./public_html/set_env.php; bye" && break || {
              echo "FTP upload failed (attempt $i/5). Retrying in 5 seconds..."
              sleep 5
            }
          done

      - name: Zip AI Frontend Build
        run: |
          cd ai.gethotelstays.com/dist
          zip -r ../../ai-frontend.zip .
          cd ../..

      - name: Deploy AI Frontend to cPanel
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          for i in {1..5}; do
            lftp -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER" -e "set ftp:ssl-allow no; set ftp:passive-mode yes; set net:timeout 120; set net:max-retries 10; set net:reconnect-interval-base 3; set ftp:prefer-epsv false; put ai-frontend.zip -o ./ai.gethotelstays.com/ai-frontend.zip; bye" && break || {
              echo "FTP upload failed (attempt $i/5). Retrying in 5 seconds..."
              sleep 5
            }
          done

      - name: Trigger Remote Extraction & Env Update
        run: |
          echo "Updating live .env configurations..."
          ENV_RESPONSE=$(curl -sS --max-time 30 https://gethotelstays.com/set_env.php)
          echo "Env Update Response: $ENV_RESPONSE"

          echo "Triggering remote extraction..."
          RESPONSE=$(curl -sS --max-time 30 https://gethotelstays.com/unzip.php)
          echo "Server Response: $RESPONSE"
          if [ "$RESPONSE" != "DEPLOYS_SUCCESS" ]; then
              echo "Error: Remote extraction failed or timed out. Checking if files exist."
              exit 1
          fi
          echo "Remote extraction completed successfully!"

          echo "Extracting AI frontend..."
          AI_RESPONSE=$(curl -sS --max-time 30 "https://gethotelstays.com/unzip.php?action=extract_ai")
          echo "AI Extraction Response: $AI_RESPONSE"

          echo "Extracting backend to /home/vgyuvmpi/gethotel_backend/..."
          BACKEND_RESPONSE=$(curl -sS --max-time 90 "https://gethotelstays.com/unzip.php?action=extract_backend")
          echo "Backend Extraction Response: $BACKEND_RESPONSE"
          if [ "$BACKEND_RESPONSE" != "BACKEND_DEPLOY_SUCCESS" ]; then
              echo "Warning: Backend extraction response unexpected: $BACKEND_RESPONSE"
          else
              echo "Backend deploy + restart completed!"
          fi

      - name: Sync Backend to Root & Restart
        run: |
          echo "Syncing backend files from gethotel_backend/ to root and restarting..."
          SYNC_RESPONSE=$(curl -sS --max-time 60 "https://gethotelstays.com/unzip.php?action=sync_backend")
          echo "Sync Response: $SYNC_RESPONSE"

      - name: Finalize
        run: echo "Deployment and Env updates completed successfully!"
