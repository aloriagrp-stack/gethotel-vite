name: Deploy GetHotelStays to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Build Main Frontend
        run: |
          cd GetHotel-Vite
          npm install
          npm run build

      - name: Build AI Chat Frontend
        run: |
          cd ai.gethotelstays.com
          npm install
          npm run build

      - name: Check Backend Changes
        id: backend_changes
        run: |
          CHANGED=$(git diff --name-only HEAD~10 HEAD -- "GetHotel backend/" | grep -v '\.log$' | grep -v '^GetHotel backend/tmp/' | grep -v '^GetHotel backend/logs/' || true)
          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No backend changes detected, skipping backend deploy."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Backend changes detected:"
            echo "$CHANGED"
          fi

      - name: Deploy Backend via lftp (full mirror)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Deploying FULL backend directory via lftp mirror..."
          echo "$(date)" > "GetHotel backend/tmp/restart.txt"
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER" <<'LFTPEOF'
          set ftp:ssl-allow no
          set ftp:passive-mode yes
          set net:timeout 60
          set net:max-retries 5
          set net:reconnect-interval-base 5
          mirror --reverse --ignore-time --no-perms --verbose \
            -x '^\.' \
            -x '^node_modules/' \
            -x '\.env$' \
            -x '\.zip$' \
            -x '\.log$' \
            -x '^scratch/' \
            -x '^uploads/' \
            -x '^logs/' \
            "GetHotel backend/" ./gethotel_backend/
          put "GetHotel backend/tmp/restart.txt" -o ./gethotel_backend/tmp/restart.txt
          bye
          LFTPEOF
          echo "Triggering live Node.js process restart..."
          curl -s "https://gethotelstays.com/api/test?restart=true&fix_token=gethotel_maint_2026" || true
          echo "Backend full mirror deploy + restart completed!"

      - name: Zip Main Frontend Build
        run: |
          cd GetHotel-Vite/dist/client
          zip -r ../../../frontend.zip .
          cd ../../..

      - name: Deploy Main Frontend Zip to cPanel
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER" -e "set ftp:ssl-allow no; set ftp:passive-mode yes; set net:timeout 60; set net:max-retries 2; put frontend.zip -o ./public_html/frontend.zip; put unzip.php -o ./public_html/unzip.php; put set_env.php -o ./public_html/set_env.php; bye"

      - name: Zip AI Frontend Build
        run: |
          cd ai.gethotelstays.com/dist
          zip -r ../../ai-frontend.zip .
          cd ../..

      - name: Deploy AI Frontend to cPanel
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER" -e "set ftp:ssl-allow no; set ftp:passive-mode yes; set net:timeout 60; set net:max-retries 2; put ai-frontend.zip -o ./ai.gethotelstays.com/ai-frontend.zip; bye"

      - name: Trigger Remote Extraction & Env Update
        run: |
          echo "Updating live .env configurations..."
          ENV_RESPONSE=$(curl -sS --max-time 30 https://gethotelstays.com/set_env.php)
          echo "Env Update Response: $ENV_RESPONSE"

          echo "Triggering remote extraction..."
          RESPONSE=$(curl -sS --max-time 30 https://gethotelstays.com/unzip.php)
          echo "Server Response: $RESPONSE"
          if [ "$RESPONSE" != "DEPLOYS_SUCCESS" ]; then
              echo "Error: Remote extraction failed or timed out. Checking if files exist."
              exit 1
          fi
          echo "Remote extraction completed successfully!"

          echo "Extracting AI frontend..."
          AI_RESPONSE=$(curl -sS --max-time 30 "https://gethotelstays.com/unzip.php?action=extract_ai")
          echo "AI Extraction Response: $AI_RESPONSE"

      - name: Sync Backend to Root & Restart
        run: |
          echo "Syncing backend files from gethotel_backend/ to root and restarting..."
          SYNC_RESPONSE=$(curl -sS --max-time 60 "https://gethotelstays.com/unzip.php?action=sync_backend")
          echo "Sync Response: $SYNC_RESPONSE"

      - name: Finalize
        run: echo "Deployment and Env updates completed successfully!"
