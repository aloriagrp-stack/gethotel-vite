name: Deploy GetHotel (Natural Automation)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Frontend
        working-directory: "./GetHotel frontend"
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          npm install
          npm run build

      - name: ZIP Build Artifacts
        run: |
          cd "GetHotel frontend"
          zip -r ../frontend_build.zip .next public package.json next.config.js server.js
          cd ..

      - name: Upload Build via FTP
        run: |
          curl -T frontend_build.zip "ftp://${{ secrets.FTP_SERVER }}/frontend_build.zip" \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            --ftp-create-dirs --ftp-ssl-control || \
          curl -T frontend_build.zip "ftp://${{ secrets.FTP_SERVER }}/frontend_build.zip" \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            --ftp-create-dirs

      - name: SSH and Extract Build
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ~/gethotel_frontend
            # Backup old build
            mv .next .next_old || true
            unzip -o ~/frontend_build.zip -d ./
            npm install --production
            rm -rf .next_old
            rm ~/frontend_build.zip
            # Restart the Node.js application
            touch tmp/restart.txt || true
            echo "Deployment Successful! Site is now live."
