name: Deploy GetHotelStays to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Build Frontend
        run: |
          cd GetHotel-Vite
          npm install
          npm run build

      - name: Deploy Backend & Frontend via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          # 1. Deploy Changed Backend Files
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD 2>/dev/null || echo "server.js")
          echo "Changed files: $CHANGED"
          
          for FILE in $CHANGED; do
            # Skip excluded patterns
            if echo "$FILE" | grep -qE '(\.git|\.github|node_modules|\.env$|\.zip$|\.log$|scratch)'; then
              echo "Skipping excluded: $FILE"
              continue
            fi
            
            # Process backend files
            if [[ "$FILE" =~ ^"GetHotel backend/" ]]; then
              if [ -f "$FILE" ]; then
                REL_PATH=${FILE#"GetHotel backend/"}
                DIR_NAME=$(dirname "$REL_PATH")
                BASE_NAME=$(basename "$REL_PATH")
                
                if [ "$DIR_NAME" = "." ]; then
                  REMOTE_DIR="./gethotel_backend"
                else
                  REMOTE_DIR="./gethotel_backend/$DIR_NAME"
                fi
                
                echo "Uploading backend file: $FILE -> $REMOTE_DIR/$BASE_NAME"
                lftp -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER" -e "set ftp:ssl-allow no; set ftp:passive-mode yes; set net:timeout 30; set net:max-retries 3; mkdir -p $REMOTE_DIR; put $FILE -o $REMOTE_DIR/$BASE_NAME; bye"
              fi
            fi
          done

          # 2. Deploy Frontend Built Files (Sync dist to public_html)
          if [ -d "GetHotel-Vite/dist" ]; then
            echo "Syncing frontend dist files to ./public_html..."
            lftp -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER" -e "set ftp:ssl-allow no; set ftp:passive-mode yes; set net:timeout 30; set net:max-retries 3; mkdir -p ./public_html; mirror -R GetHotel-Vite/dist ./public_html; bye"
          fi

          echo "Deployment completed successfully!"
