name: Deploy GetHotelStays to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Build Frontend
        run: |
          cd GetHotel-Vite
          npm install
          npm run build

      - name: Deploy Backend via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD 2>/dev/null || echo "server.js")
          echo "Changed files: $CHANGED"

          for FILE in $CHANGED; do
            if echo "$FILE" | grep -qE '(\.git|\.github|node_modules|\.env$|\.zip$|\.log$|scratch)'; then
              echo "Skipping excluded: $FILE"
              continue
            fi

            if [[ "$FILE" =~ ^"GetHotel backend/" ]]; then
              if [ -f "$FILE" ]; then
                REL_PATH=${FILE#"GetHotel backend/"}
                DIR_NAME=$(dirname "$REL_PATH")
                BASE_NAME=$(basename "$REL_PATH")

                if [ "$DIR_NAME" = "." ]; then
                  REMOTE_DIR="./gethotel_backend"
                else
                  REMOTE_DIR="./gethotel_backend/$DIR_NAME"
                fi

                echo "Uploading: $FILE -> $REMOTE_DIR/$BASE_NAME"
                lftp -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER" -e "set ftp:ssl-allow no; set ftp:passive-mode yes; set net:timeout 60; set net:max-retries 2; put $FILE -o $REMOTE_DIR/$BASE_NAME; bye"
              fi
            fi
          done

      - name: Zip Frontend Build
        run: |
          cd GetHotel-Vite/dist
          zip -r ../../frontend.zip .
          cd ../..

      - name: Deploy Frontend Zip to cPanel
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER" -e "set ftp:ssl-allow no; set ftp:passive-mode yes; set net:timeout 60; set net:max-retries 2; put frontend.zip -o ./public_html/frontend.zip; put unzip.php -o ./public_html/unzip.php; bye"

      - name: Trigger Remote Extraction
        run: |
          echo "Triggering remote extraction..."
          RESPONSE=$(curl -sS --max-time 30 https://gethotelstays.com/unzip.php)
          echo "Server Response: $RESPONSE"
          if [ "$RESPONSE" != "DEPLOYS_SUCCESS" ]; then
              echo "Error: Remote extraction failed or timed out. Checking if files exist."
              exit 1
          fi
          echo "Remote extraction completed successfully!"

      - name: Finalize
        run: echo "Deployment completed successfully!"
