name: Deploy Backend to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install LFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: 🚀 Deploy to cPanel via LFTP
        run: |
          lftp -d -c "
            set ftp:ssl-allow no;
            set net:timeout 10;
            set net:max-retries 2;
            set net:reconnect-interval-base 5;
            set ftp:connection-limit 2;
            open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' -p 21 ${{ secrets.FTP_SERVER }};
            mirror --reverse --continue --verbose --ignore-time \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob node_modules/ \
              --exclude-glob .env \
              --exclude-glob *.zip \
              --exclude-glob *.log \
              --exclude-glob scratch/ \
              --exclude-glob clean_specific_hotels.js \
              --exclude-glob delete_non_cottages.js \
              --exclude-glob list_hotels.js \
              ./ ./gethotel_backend/
          "
