name: Deploy Backend to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy backend files via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "$(date)" > restart.txt
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER" <<'LFTPEOF'
          set ftp:ssl-allow no
          set ftp:passive-mode yes
          set net:timeout 60
          set net:max-retries 5
          set net:reconnect-interval-base 5
          mirror --reverse --ignore-time --no-perms --verbose \
            -x '^\.git/' \
            -x '^\.github/' \
            -x '^node_modules/' \
            -x '^\.env$' \
            -x '\.zip$' \
            -x '\.log$' \
            -x '^scratch/' \
            -x '^uploads/' \
            . ./
          mirror --reverse --ignore-time --no-perms --verbose \
            -x '^\.git/' \
            -x '^\.github/' \
            -x '^node_modules/' \
            -x '^\.env$' \
            -x '\.zip$' \
            -x '\.log$' \
            -x '^scratch/' \
            -x '^uploads/' \
            . ./gethotel_backend/
          put middleware/security.js -o ./middleware/security.js
          put middleware/security.js -o ./gethotel_backend/middleware/security.js
          put controllers/authController.js -o ./controllers/authController.js
          put controllers/authController.js -o ./gethotel_backend/controllers/authController.js
          put server.js -o ./server.js
          put server.js -o ./gethotel_backend/server.js
          put config/blocked_ips.json -o ./config/blocked_ips.json
          put config/blocked_ips.json -o ./gethotel_backend/config/blocked_ips.json
          put restart.txt -o ./tmp/restart.txt
          put restart.txt -o ./gethotel_backend/tmp/restart.txt
          bye
          LFTPEOF
          echo "Triggering live Node.js process restart..."
          curl -s "https://gethotelstays.com/api/test?restart=true&fix_token=gethotel_maint_2026" || true
          echo "Backend deploy + restart completed!"
