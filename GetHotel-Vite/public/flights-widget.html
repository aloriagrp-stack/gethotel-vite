<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flights Widget</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #search-card {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #f1f5f9;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      padding: 24px;
      margin-bottom: 24px;
    }
    @media (min-width: 768px) {
      #search-card {
        padding: 32px;
      }
    }
    /* Hide the "Show hotels" checkbox to prevent Booking.com hotel search results */
    label[class*="SearchEdit-module__hotelsLabel"] {
      display: none !important;
    }
    #tpwl-tickets {
      border-radius: 16px;
      overflow: hidden;
      position: relative;
    }
    #tpwl-tickets > div,
    #tpwl-tickets > div > div {
      border-radius: 16px !important;
      overflow: hidden !important;
    }
  </style>
</head>
<body>
  <!-- Wrapper container to prevent infinite height expansion feedback loop -->
  <div id="widget-wrapper" style="width: 100%; display: flow-root;">
    <!-- Search form card container styled directly inside the iframe -->
    <div id="search-card">
      <!-- Metasearch widget container -->
      <div id="tpwl-search"></div>
    </div>
    
    <!-- Search results container -->
    <div id="tpwl-tickets"></div>
  </div>

  <script>
    // Helper function to check if a URL is a search redirect or internal target
    function isSearchRedirect(url) {
      if (!url) return false;
      const urlStr = String(url).toLowerCase();
      // If it contains flightsearch, flights-widget, or search airport queries, it is a search redirect
      if (urlStr.includes('flightsearch') || 
          urlStr.includes('flights-widget') || 
          urlStr.includes('destination_airports') ||
          urlStr.includes('origin_airports')) {
        return true;
      }
      const hostname = window.location.hostname;
      return url.startsWith('/') || url.startsWith('./') || url.includes(hostname);
    }

    // Monkeypatch window.open, parent.open, and top.open
    const originalOpen = window.open;
    window.open = function(url, target, features) {
      if (isSearchRedirect(url)) {
        window.location.href = url;
        return window;
      }
      return originalOpen.apply(this, arguments);
    };

    try {
      if (window.parent && window.parent !== window) {
        const originalParentOpen = window.parent.open;
        window.parent.open = function(url, target, features) {
          if (isSearchRedirect(url)) {
            window.location.href = url;
            return window;
          }
          const openFn = originalParentOpen || window.parent.open;
          return openFn.apply(this, arguments);
        };
      }
    } catch (e) {
      console.error("Failed to monkeypatch parent.open:", e);
    }

    try {
      if (window.top && window.top !== window) {
        const originalTopOpen = window.top.open;
        window.top.open = function(url, target, features) {
          if (isSearchRedirect(url)) {
            window.location.href = url;
            return window;
          }
          const openFn = originalTopOpen || window.top.open;
          return openFn.apply(this, arguments);
        };
      }
    } catch (e) {
      console.error("Failed to monkeypatch top.open:", e);
    }

    // Helper to register capture listeners on a document
    function registerListeners(doc) {
      if (!doc) return;

      // Capture all form submissions: if inside search widget or search target, force _self
      doc.addEventListener('submit', function(event) {
        const form = event.target;
        const action = form.getAttribute('action') || '';
        if (form.closest('#tpwl-search') || action === '' || isSearchRedirect(action)) {
          form.setAttribute('target', '_self');
        }
      }, true);

      // Capture all click events on anchors: if inside search widget or search target, force _self
      doc.addEventListener('click', function(event) {
        let target = event.target;
        while (target && target !== doc.body) {
          if (target.tagName === 'A') {
            const href = target.getAttribute('href');
            if (target.closest('#tpwl-search') || isSearchRedirect(href)) {
              target.setAttribute('target', '_self');
            }
            break;
          }
          target = target.parentNode;
        }
      }, true);
    }

    // Register on local document
    registerListeners(document);

    // Register on parent and top documents if accessible
    try {
      if (window.parent && window.parent !== window && window.parent.document) {
        registerListeners(window.parent.document);
      }
    } catch (e) {
      console.warn("Could not register listeners on parent document:", e);
    }

    try {
      if (window.top && window.top !== window && window.top.document) {
        registerListeners(window.top.document);
      }
    } catch (e) {
      console.warn("Could not register listeners on top document:", e);
    }

    window.TPWL_CONFIGURATION = {
      ...window.TPWL_CONFIGURATION,
      resultsURL: window.location.origin + window.location.pathname
    };
  </script>

  <script nowprocket data-noptimize="1" data-cfasync="false" data-wpfc-render="false" seraph-accel-crit="1" data-no-defer="1">
    (function () {
      var script = document.createElement("script");
      script.async = 1;
      script.type = "module";
      script.src = "https://tpwdgt.com/wl_web/main.js?wl_id=19509";
      document.head.appendChild(script);
    })();
  </script>

  <!-- Script to communicate content height to parent for auto-resize and programmatically uncheck hotels -->
  <script>
    function disableHotelsCheckbox() {
      const checkbox = document.querySelector('input[type="checkbox"]');
      if (checkbox && checkbox.checked) {
        checkbox.click();
      }
    }

    function fixFormTarget() {
      const forms = document.querySelectorAll('#tpwl-search form');
      forms.forEach(form => {
        if (form.getAttribute('target') !== '_self') {
          form.setAttribute('target', '_self');
        }
      });
    }

    function fixLinkTargets() {
      const links = document.querySelectorAll('#tpwl-search a');
      links.forEach(link => {
        if (link.getAttribute('target') !== '_self') {
          link.setAttribute('target', '_self');
        }
      });
    }

    function getActualContentHeight() {
      const wrapper = document.getElementById("widget-wrapper");
      if (!wrapper) return 0;
      const children = wrapper.getElementsByTagName("*");
      let maxBottom = 0;
      for (let i = 0; i < children.length; i++) {
        const child = children[i];
        if (child.id === 'widget-wrapper') continue;
        if (child.offsetWidth > 0 && child.offsetHeight > 0) {
          const rect = child.getBoundingClientRect();
          if (rect.bottom > maxBottom) {
            maxBottom = rect.bottom;
          }
        }
      }
      return maxBottom;
    }

    function sendHeight() {
      const height = getActualContentHeight();
      if (height > 0) {
        window.parent.postMessage({ type: 'resize-iframe', height: height + 16 }, '*');
      }
    }

    function handleDOMChange() {
      disableHotelsCheckbox();
      fixFormTarget();
      fixLinkTargets();
      sendHeight();
    }

    // Run on load, resize, and periodically
    window.addEventListener('load', handleDOMChange);
    window.addEventListener('resize', handleDOMChange);
    
    // Set up a MutationObserver to watch for DOM changes (like tickets loading)
    const observer = new MutationObserver(handleDOMChange);
    observer.observe(document.body, { childList: true, subtree: true, attributes: true });

    // Fallback interval
    setInterval(handleDOMChange, 400);
  </script>
</body>
</html>
