<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flights Widget</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #search-card {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -2px rgba(0, 0, 0, 0.02);
      padding: 24px;
      margin-bottom: 0px;
    }
    @media (min-width: 768px) {
      #search-card {
        padding: 32px;
      }
    }
    /* Hide all internal separator/divider lines inside search bar inputs */
    [class*="divider"],
    [class*="Divider"],
    [class*="separator"],
    [class*="Separator"] {
      display: none !important;
      opacity: 0 !important;
      border: none !important;
      width: 0 !important;
    }
    /* Remove vertical pseudo-element borders that act as dividers */
    [class*="field"]::after,
    [class*="field"]::before,
    [class*="Field"]::after,
    [class*="Field"]::before,
    [class*="control"]::after,
    [class*="control"]::before,
    [class*="Control"]::after,
    [class*="Control"]::before {
      display: none !important;
      border: none !important;
    }
    /* Hide the "Show hotels" checkbox to prevent Booking.com hotel search results */
    label[class*="SearchEdit-module__hotelsLabel"] {
      display: none !important;
    }
    /* Hide any element containing "Show hotels" or "hotel" checkbox text */
    [class*="hotels"], [class*="Hotels"] {
      display: none !important;
    }
    #tpwl-tickets {
      border-radius: 16px;
      overflow: hidden;
      position: relative;
    }
    #tpwl-tickets > div,
    #tpwl-tickets > div > div {
      border-radius: 16px !important;
      overflow: hidden !important;
    }
    /* Nuclear CSS: hide any booking.com iframes that may get injected */
    iframe[src*="booking.com"],
    iframe[src*="hotellook"],
    iframe[src*="hotelscombined"] {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      pointer-events: none !important;
    }

    /* Instant Search Loader & Skeleton Animation Styles */
    @keyframes searchProgressMove {
      0% { left: -30%; width: 30%; }
      50% { left: 25%; width: 50%; }
      100% { left: 100%; width: 30%; }
    }
    .loader-progress-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      background: linear-gradient(90deg, #2563eb, #3b82f6, #60a5fa);
      border-radius: 9999px;
      animation: searchProgressMove 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes planeBob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-3px) rotate(6deg); }
    }
    .loader-plane-spinner {
      font-size: 22px;
      line-height: 1;
      display: inline-block;
      animation: planeBob 0.9s ease-in-out infinite;
    }
    .pulsing-green-dot {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: greenPulse 1.5s infinite;
    }
    @keyframes greenPulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .skeleton-ticket-card {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      padding: 22px 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04);
    }
    @keyframes shimmerAnim {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton-shimmer {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: shimmerAnim 1.4s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <!-- Wrapper container to prevent infinite height expansion feedback loop -->
  <div id="widget-wrapper" style="width: 100%; display: flow-root;">
    <!-- Search form card container styled directly inside the iframe -->
    <div id="search-card">
      <!-- Metasearch widget container -->
      <div id="tpwl-search"></div>
    </div>
    
    <!-- Instant Search Loader & Skeleton Cards (Visible immediately on 'Search flights' click) -->
    <div id="instant-search-loader" style="display: none; padding-top: 18px; padding-bottom: 24px;">
      <!-- Live Progress & Status Header -->
      <div style="background: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 18px 24px; margin-bottom: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04);">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 10px;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div class="loader-plane-spinner">✈</div>
            <div>
              <div style="font-size: 15px; font-weight: 700; color: #0f172a;" id="loader-status-text">Searching 100+ airlines for lowest airfares...</div>
              <div style="font-size: 12px; color: #64748b; margin-top: 3px;" id="loader-sub-text">Scanning IndiGo, Air India, SpiceJet, Akasa Air...</div>
            </div>
          </div>
          <div style="display: inline-flex; align-items: center; gap: 6px; background: #ecfdf5; border: 1px solid #a7f3d0; padding: 4px 10px; font-size: 11px; font-weight: 600; color: #059669; border-radius: 9999px;">
            <span class="pulsing-green-dot"></span> Live Airfare Scan
          </div>
        </div>
        <!-- Progress Bar Track -->
        <div style="width: 100%; height: 5px; background: #f1f5f9; border-radius: 9999px; overflow: hidden; position: relative;">
          <div class="loader-progress-bar"></div>
        </div>
      </div>

      <!-- Shimmering Skeleton Ticket Placeholders -->
      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div class="skeleton-ticket-card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
            <div style="display: flex; align-items: center; gap: 10px;">
              <div class="skeleton-shimmer" style="width: 32px; height: 32px; border-radius: 50%;"></div>
              <div>
                <div class="skeleton-shimmer" style="width: 90px; height: 13px; border-radius: 4px; margin-bottom: 4px;"></div>
                <div class="skeleton-shimmer" style="width: 60px; height: 10px; border-radius: 4px;"></div>
              </div>
            </div>
            <div class="skeleton-shimmer" style="width: 76px; height: 22px; border-radius: 12px;"></div>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;">
            <div style="display: flex; align-items: center; gap: 20px; flex: 1; min-width: 240px;">
              <div>
                <div class="skeleton-shimmer" style="width: 65px; height: 20px; border-radius: 4px; margin-bottom: 4px;"></div>
                <div class="skeleton-shimmer" style="width: 45px; height: 11px; border-radius: 4px;"></div>
              </div>
              <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
                <div class="skeleton-shimmer" style="width: 55px; height: 10px; border-radius: 4px;"></div>
                <div class="skeleton-shimmer" style="width: 100%; max-width: 150px; height: 2px; border-radius: 2px;"></div>
              </div>
              <div>
                <div class="skeleton-shimmer" style="width: 65px; height: 20px; border-radius: 4px; margin-bottom: 4px;"></div>
                <div class="skeleton-shimmer" style="width: 45px; height: 11px; border-radius: 4px;"></div>
              </div>
            </div>
            <div style="display: flex; align-items: center; gap: 14px;">
              <div style="text-align: right;">
                <div class="skeleton-shimmer" style="width: 80px; height: 22px; border-radius: 4px; margin-bottom: 4px;"></div>
                <div class="skeleton-shimmer" style="width: 45px; height: 10px; border-radius: 4px;"></div>
              </div>
              <div class="skeleton-shimmer" style="width: 105px; height: 38px; border-radius: 8px;"></div>
            </div>
          </div>
        </div>

        <div class="skeleton-ticket-card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
            <div style="display: flex; align-items: center; gap: 10px;">
              <div class="skeleton-shimmer" style="width: 32px; height: 32px; border-radius: 50%;"></div>
              <div>
                <div class="skeleton-shimmer" style="width: 95px; height: 13px; border-radius: 4px; margin-bottom: 4px;"></div>
                <div class="skeleton-shimmer" style="width: 65px; height: 10px; border-radius: 4px;"></div>
              </div>
            </div>
            <div class="skeleton-shimmer" style="width: 76px; height: 22px; border-radius: 12px;"></div>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;">
            <div style="display: flex; align-items: center; gap: 20px; flex: 1; min-width: 240px;">
              <div>
                <div class="skeleton-shimmer" style="width: 65px; height: 20px; border-radius: 4px; margin-bottom: 4px;"></div>
                <div class="skeleton-shimmer" style="width: 45px; height: 11px; border-radius: 4px;"></div>
              </div>
              <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
                <div class="skeleton-shimmer" style="width: 55px; height: 10px; border-radius: 4px;"></div>
                <div class="skeleton-shimmer" style="width: 100%; max-width: 150px; height: 2px; border-radius: 2px;"></div>
              </div>
              <div>
                <div class="skeleton-shimmer" style="width: 65px; height: 20px; border-radius: 4px; margin-bottom: 4px;"></div>
                <div class="skeleton-shimmer" style="width: 45px; height: 11px; border-radius: 4px;"></div>
              </div>
            </div>
            <div style="display: flex; align-items: center; gap: 14px;">
              <div style="text-align: right;">
                <div class="skeleton-shimmer" style="width: 80px; height: 22px; border-radius: 4px; margin-bottom: 4px;"></div>
                <div class="skeleton-shimmer" style="width: 45px; height: 10px; border-radius: 4px;"></div>
              </div>
              <div class="skeleton-shimmer" style="width: 105px; height: 38px; border-radius: 8px;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Search results container -->
    <div id="tpwl-tickets"></div>
  </div>

  <script>
    // ========================================================================
    // Save original widget URL for restoration after hijack
    // ========================================================================
    var WIDGET_ORIGIN_URL = window.location.href;

    // Continuously save the current URL so parent can restore after a hijack
    setInterval(function() {
      try {
        var currentUrl = window.location.href;
        if (currentUrl.includes('flights-widget')) {
          sessionStorage.setItem('__fw_last_url', currentUrl);
          window.parent.postMessage({ type: 'widget-url-update', url: currentUrl }, '*');
        }
      } catch(e) {}
    }, 500);

    // On beforeunload, save current state
    window.addEventListener('beforeunload', function() {
      try {
        window.parent.postMessage({ type: 'widget-url-update', url: window.location.href }, '*');
      } catch(e) {}
    });

    // ========================================================================
    // LAYER 1: URL classification helpers
    // ========================================================================

    function isHotelRedirect(url) {
      if (!url) return false;
      var u = String(url).toLowerCase();
      if (u.includes('booking.com') || u.includes('hotellook') || u.includes('hotelscombined')) return true;
      if ((u.includes('tp.media') || u.includes('c.tp.st') || u.includes('travelpayouts')) &&
          (u.includes('hotel') || u.includes('booking') || u.includes('hotellook'))) return true;
      return false;
    }

    function isExternalUrl(url) {
      if (!url || url === '' || url === '#' || url.startsWith('javascript:')) return false;
      try {
        var parsed = new URL(url, window.location.href);
        var currentHost = window.location.hostname.replace(/^www\./i, '');
        var targetHost = parsed.hostname.replace(/^www\./i, '');
        if (targetHost === currentHost || targetHost === 'localhost' || targetHost === '127.0.0.1') return false;
        return true;
      } catch (e) {
        return false;
      }
    }

    function isFlightPartnerRedirect(url) {
      if (!url) return false;
      var u = String(url).toLowerCase();
      if (isHotelRedirect(url)) return false;
      if (u.includes('tpwdgt.com')) return true;
      if (isExternalUrl(url)) return true;
      return false;
    }

    function isSearchRedirect(url) {
      if (!url) return false;
      var urlStr = String(url).toLowerCase();
      if (urlStr.includes('flightsearch') || 
          urlStr.includes('flights-widget') || 
          urlStr.includes('destination_airports') ||
          urlStr.includes('origin_airports')) {
        return true;
      }
      try {
        var parsedUrl = new URL(url, window.location.href);
        var currentHost = window.location.hostname.replace(/^www\./i, '');
        var targetHost = parsedUrl.hostname.replace(/^www\./i, '');
        if (targetHost === currentHost || targetHost === 'localhost' || targetHost === '127.0.0.1') {
          return true;
        }
      } catch (e) {}
      var cleanHostname = window.location.hostname.replace(/^www\./i, '');
      return url.startsWith('/') || url.startsWith('./') || url.includes(cleanHostname);
    }

    // ========================================================================
    // LAYER 2: Intercept fetch() and XMLHttpRequest
    // Kill any hotel-related API calls at the network level so the widget
    // never even gets hotel data to trigger a redirect
    // ========================================================================

    try {
      var origFetch = window.fetch;
      window.fetch = function(input) {
        var url = '';
        if (typeof input === 'string') url = input;
        else if (input && input.url) url = input.url;
        var lowerUrl = url.toLowerCase();
        if (lowerUrl.includes('hotellook') || lowerUrl.includes('hotelscombined') ||
            (lowerUrl.includes('booking.com') && !lowerUrl.includes('flight'))) {
          console.log('[flights-widget] Blocked fetch to hotel endpoint:', url);
          return Promise.resolve(new Response('{}', { status: 200, headers: { 'Content-Type': 'application/json' } }));
        }
        return origFetch.apply(this, arguments);
      };
    } catch(e) {}

    try {
      var origXHROpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function(method, url) {
        this.__fw_url = String(url || '').toLowerCase();
        this.__fw_blocked = false;
        if (this.__fw_url.includes('hotellook') || this.__fw_url.includes('hotelscombined') ||
            (this.__fw_url.includes('booking.com') && !this.__fw_url.includes('flight'))) {
          this.__fw_blocked = true;
          console.log('[flights-widget] Blocked XHR to hotel endpoint:', url);
        }
        return origXHROpen.apply(this, arguments);
      };

      var origXHRSend = XMLHttpRequest.prototype.send;
      XMLHttpRequest.prototype.send = function() {
        if (this.__fw_blocked) {
          var self = this;
          Object.defineProperty(self, 'status', { value: 200, writable: false });
          Object.defineProperty(self, 'readyState', { value: 4, writable: false });
          Object.defineProperty(self, 'responseText', { value: '{}', writable: false });
          Object.defineProperty(self, 'response', { value: '{}', writable: false });
          setTimeout(function() {
            if (typeof self.onreadystatechange === 'function') self.onreadystatechange();
            if (typeof self.onload === 'function') self.onload();
          }, 10);
          return;
        }
        return origXHRSend.apply(this, arguments);
      };
    } catch(e) {}

    // ========================================================================
    // LAYER 3: Override window.open (and parent/top)
    // ========================================================================

    var originalOpen = window.open;
    window.open = function(url, target, features) {
      if (isHotelRedirect(url)) {
        console.log("[flights-widget] Blocked window.open to hotel:", url);
        return window;
      }
      if (isFlightPartnerRedirect(url)) {
        console.log("[flights-widget] Opening partner in new tab:", url);
        window.parent.postMessage({ type: 'flight-partner-intent' }, '*');
        return originalOpen.call(window, url, '_blank');
      }
      if (isSearchRedirect(url)) {
        window.location.href = url;
        return window;
      }
      return originalOpen.apply(this, arguments);
    };

    try {
      if (window.parent && window.parent !== window) {
        var originalParentOpen = window.parent.open;
        window.parent.open = function(url) {
          if (isHotelRedirect(url)) {
            console.log("[flights-widget] Blocked parent.open to hotel:", url);
            return window;
          }
          if (isFlightPartnerRedirect(url)) {
            console.log("[flights-widget] Opening partner via parent in new tab:", url);
            window.parent.postMessage({ type: 'flight-partner-intent' }, '*');
            return originalOpen.call(window, url, '_blank');
          }
          if (isSearchRedirect(url)) { window.location.href = url; return window; }
          return (originalParentOpen || window.parent.open).apply(this, arguments);
        };
      }
    } catch (e) {}

    try {
      if (window.top && window.top !== window) {
        var originalTopOpen = window.top.open;
        window.top.open = function(url) {
          if (isHotelRedirect(url)) {
            console.log("[flights-widget] Blocked top.open to hotel:", url);
            return window;
          }
          if (isFlightPartnerRedirect(url)) {
            console.log("[flights-widget] Opening partner via top in new tab:", url);
            window.parent.postMessage({ type: 'flight-partner-intent' }, '*');
            return originalOpen.call(window, url, '_blank');
          }
          if (isSearchRedirect(url)) { window.location.href = url; return window; }
          return (originalTopOpen || window.top.open).apply(this, arguments);
        };
      }
    } catch (e) {}

    // ========================================================================
    // LAYER 4: Override location.assign, location.replace
    // ========================================================================

    try {
      var origAssign = window.location.assign.bind(window.location);
      window.location.assign = function(url) {
        if (isHotelRedirect(url)) { console.log("[flights-widget] Blocked location.assign:", url); return; }
        if (isFlightPartnerRedirect(url)) {
          console.log("[flights-widget] Opening partner (assign) in new tab:", url);
          window.parent.postMessage({ type: 'flight-partner-intent' }, '*');
          originalOpen.call(window, url, '_blank');
          return;
        }
        origAssign(url);
      };
    } catch (e) {}

    try {
      var origReplace = window.location.replace.bind(window.location);
      window.location.replace = function(url) {
        if (isHotelRedirect(url)) { console.log("[flights-widget] Blocked location.replace:", url); return; }
        if (isFlightPartnerRedirect(url)) {
          console.log("[flights-widget] Opening partner (replace) in new tab:", url);
          window.parent.postMessage({ type: 'flight-partner-intent' }, '*');
          originalOpen.call(window, url, '_blank');
          return;
        }
        origReplace(url);
      };
    } catch (e) {}

    // ========================================================================
    // LAYER 5: Override HTMLFormElement.prototype.submit + action property setter
    // ========================================================================

    try {
      var originalFormSubmit = HTMLFormElement.prototype.submit;
      HTMLFormElement.prototype.submit = function() {
        var action = this.getAttribute('action') || '';
        if (isHotelRedirect(action)) {
          console.log("[flights-widget] Blocked form.submit() to hotel:", action);
          return;
        }
        if (this.closest('#tpwl-search') || action === '' || isSearchRedirect(action)) {
          this.setAttribute('target', '_self');
        }
        originalFormSubmit.apply(this, arguments);
      };
    } catch (e) {}

    // Override form.action property setter to neuter external actions at assignment time
    try {
      var formActionDesc = Object.getOwnPropertyDescriptor(HTMLFormElement.prototype, 'action');
      if (formActionDesc && formActionDesc.set) {
        Object.defineProperty(HTMLFormElement.prototype, 'action', {
          set: function(val) {
            if (isHotelRedirect(val)) {
              console.log("[flights-widget] Neutered form.action =", val);
              formActionDesc.set.call(this, '');
              return;
            }
            formActionDesc.set.call(this, val);
          },
          get: formActionDesc.get,
          configurable: true
        });
      }
    } catch (e) {}

    // ========================================================================
    // LAYER 6: Override anchor click, setAttribute, target setter
    // ========================================================================

    try {
      var originalAnchorClick = HTMLAnchorElement.prototype.click;
      HTMLAnchorElement.prototype.click = function() {
        var href = this.getAttribute('href') || this.href;
        if (isHotelRedirect(href)) { return; }
        if (isFlightPartnerRedirect(href)) {
          this.setAttribute('target', '_blank');
          this.setAttribute('rel', 'noopener noreferrer');
          window.parent.postMessage({ type: 'flight-partner-intent' }, '*');
        }
        if (isSearchRedirect(href)) { this.setAttribute('target', '_self'); }
        originalAnchorClick.apply(this, arguments);
      };
    } catch (e) {}

    try {
      var originalSetAttribute = Element.prototype.setAttribute;
      Element.prototype.setAttribute = function(name, value) {
        if (name === 'target' && this.tagName === 'A') {
          var href = this.getAttribute('href') || this.href;
          if (isFlightPartnerRedirect(href)) { return originalSetAttribute.call(this, name, '_blank'); }
          if (isHotelRedirect(href)) { return originalSetAttribute.call(this, name, '_self'); }
          if (value === '_blank' && isSearchRedirect(href)) { value = '_self'; }
        }
        if (name === 'action' && this.tagName === 'FORM') {
          if (isHotelRedirect(value)) {
            console.log("[flights-widget] Neutered setAttribute('action',", value, ")");
            return originalSetAttribute.call(this, name, '');
          }
        }
        return originalSetAttribute.call(this, name, value);
      };
    } catch (e) {}

    try {
      var origTargetDesc = Object.getOwnPropertyDescriptor(HTMLAnchorElement.prototype, 'target');
      if (origTargetDesc && origTargetDesc.set) {
         Object.defineProperty(HTMLAnchorElement.prototype, 'target', {
          set: function(val) {
            var href = this.getAttribute('href') || this.href;
            if (isFlightPartnerRedirect(href)) { val = '_blank'; }
            else if (val === '_blank') {
              if (isSearchRedirect(href) || isHotelRedirect(href)) { val = '_self'; }
            }
            origTargetDesc.set.call(this, val);
          },
          get: origTargetDesc.get,
          configurable: true
        });
      }
    } catch (e) {}

    // ========================================================================
    // LAYER 7: Capture event listeners on document (and parent/top)
    // ========================================================================

    function registerListeners(doc) {
      if (!doc) return;

      doc.addEventListener('submit', function(event) {
        var form = event.target;
        var action = form.getAttribute('action') || '';
        if (isHotelRedirect(action)) {
          event.preventDefault(); event.stopPropagation(); return;
        }
        if (form.closest('#tpwl-search') && isExternalUrl(action)) {
          event.preventDefault(); event.stopPropagation(); return;
        }
        if (form.closest('#tpwl-search') || action === '' || isSearchRedirect(action)) {
          form.setAttribute('target', '_self');
        }
      }, true);

      doc.addEventListener('click', function(event) {
        var target = event.target;
        while (target && target !== doc.body) {
          if (target.tagName === 'A') {
            var href = target.getAttribute('href');
            if (isHotelRedirect(href)) {
              event.preventDefault(); event.stopPropagation(); return;
            }
            if (isFlightPartnerRedirect(href)) {
              // Set target=_blank and let the browser open it natively
              // (preserves user gesture context so popup won't be blocked)
              target.setAttribute('target', '_blank');
              target.setAttribute('rel', 'noopener noreferrer');
              window.parent.postMessage({ type: 'flight-partner-intent' }, '*');
              console.log('[flights-widget] Buy click → opening partner in new tab:', href);
              break; // let the default click action proceed
            }
            if (target.closest('#tpwl-search') && isExternalUrl(href)) {
              event.preventDefault(); event.stopPropagation(); return;
            }
            if (target.closest('#tpwl-search') || isSearchRedirect(href)) {
              target.setAttribute('target', '_self');
            }
            break;
          }
          target = target.parentNode;
        }
      }, true);
    }

    registerListeners(document);
    try { if (window.parent && window.parent !== window && window.parent.document) { registerListeners(window.parent.document); } } catch (e) {}
    try { if (window.top && window.top !== window && window.top.document) { registerListeners(window.top.document); } } catch (e) {}

    // ========================================================================
    // LAYER 8: MutationObserver to nuke injected booking.com iframes
    // ========================================================================

    try {
      var iframeKiller = new MutationObserver(function(mutations) {
        for (var i = 0; i < mutations.length; i++) {
          var added = mutations[i].addedNodes;
          for (var j = 0; j < added.length; j++) {
            var node = added[j];
            if (node.tagName === 'IFRAME') {
              var src = (node.getAttribute('src') || '').toLowerCase();
              if (src.includes('booking.com') || src.includes('hotellook') || src.includes('hotelscombined')) {
                node.remove();
              }
            }
          }
        }
      });
      iframeKiller.observe(document.documentElement, { childList: true, subtree: true });
    } catch (e) {}

    // ========================================================================
    // Widget configuration — disable hotels via every possible flag
    // ========================================================================
    window.TPWL_CONFIGURATION = {
      ...window.TPWL_CONFIGURATION,
      resultsURL: window.location.origin + window.location.pathname,
      // Shotgun: set every possible flag to disable hotel search
      showHotels: false,
      show_hotels: false,
      hotels: false,
      hotelsEnabled: false,
      hotels_enabled: false,
      enableHotelSearch: false,
      enable_hotel_search: false,
      withHotelSearch: false,
      with_hotel_search: false,
      hotelsDisabled: true,
      hotels_disabled: true,
      hotelTab: false,
      hotel_tab: false,
      accommodation: false,
      show_accommodation: false,
    };
  </script>

  <script nowprocket data-noptimize="1" data-cfasync="false" data-wpfc-render="false" seraph-accel-crit="1" data-no-defer="1">
    (function () {
      var script = document.createElement("script");
      script.async = 1;
      script.type = "module";
      script.src = "https://tpwdgt.com/wl_web/main.js?wl_id=19509";
      document.head.appendChild(script);
    })();
  </script>

  <!-- Script to communicate content height to parent for auto-resize and programmatically uncheck hotels -->
  <script>
    function disableHotelsCheckbox() {
      // Uncheck ALL checkboxes - this widget should only have a hotels checkbox
      var checkboxes = document.querySelectorAll('input[type="checkbox"]');
      checkboxes.forEach(function(cb) {
        if (cb.checked) {
          cb.checked = false;
          cb.click(); // Trigger the widget's own uncheck handler
          // Also dispatch change event in case the widget listens for it
          cb.dispatchEvent(new Event('change', { bubbles: true }));
        }
      });
    }

    function hideHotelsCheckbox() {
      var checkboxes = document.querySelectorAll('input[type="checkbox"]');
      checkboxes.forEach(function(cb) {
        var parent = cb.closest('label') || cb.parentElement;
        if (parent) {
          parent.style.setProperty('display', 'none', 'important');
          parent.style.setProperty('visibility', 'hidden', 'important');
          parent.style.setProperty('height', '0', 'important');
          parent.style.setProperty('overflow', 'hidden', 'important');
        }
      });

      var labels = document.querySelectorAll('label, span, div');
      labels.forEach(function(el) {
        var text = el.textContent.trim().toLowerCase();
        if (text.includes('show hotels') || text === 'hotels' || text.includes('show hotel')) {
          el.style.setProperty('display', 'none', 'important');
          var parent = el.closest('div');
          if (parent && parent !== document.body && parent.id !== 'widget-wrapper' && parent.id !== 'search-card') {
            parent.style.setProperty('display', 'none', 'important');
          }
        }
      });
    }

    function fixFormTarget() {
      var forms = document.querySelectorAll('#tpwl-search form');
      forms.forEach(function(form) {
        var action = form.getAttribute('action') || '';
        if (isExternalUrl(action) || isHotelRedirect(action)) {
          form.removeAttribute('action');
          form.setAttribute('target', '_self');
        } else if (form.getAttribute('target') !== '_self') {
          form.setAttribute('target', '_self');
        }
      });
    }

    function fixLinkTargets() {
      var links = document.querySelectorAll('#tpwl-search a');
      links.forEach(function(link) {
        var href = link.getAttribute('href') || '';
        if (isHotelRedirect(href) || (isExternalUrl(href) && !href.includes('tpwdgt.com'))) {
          link.removeAttribute('href');
          link.style.setProperty('pointer-events', 'none', 'important');
        } else if (link.getAttribute('target') !== '_self') {
          link.setAttribute('target', '_self');
        }
      });
    }

    var userInteracting = false;
    var userInteractingTimeout = null;
    var searchActive = false;

    function hasSearchResults() {
      if (searchActive) return true;

      // 1. Direct tickets container check
      var ticketsContainer = document.getElementById('tpwl-tickets');
      if (ticketsContainer && ticketsContainer.children.length > 0 && ticketsContainer.offsetHeight > 60) {
        return true;
      }

      // 2. Any flight result cards, tickets, filters, or nearby dates matrix
      var resultEls = document.querySelectorAll(
        '[class*="ticket"], [class*="Ticket"], [class*="result"], [class*="Result"], ' +
        '[class*="filters"], [class*="Filters"], [class*="nearby"], [class*="Nearby"], ' +
        '[class*="matrix"], [class*="Matrix"], [class*="flightList"], [class*="FlightList"], ' +
        '[class*="proposal"], [class*="Proposal"], [class*="SearchProgress"], [class*="searchProgress"]'
      );
      for (var i = 0; i < resultEls.length; i++) {
        var el = resultEls[i];
        if (el.offsetWidth > 100 && el.offsetHeight > 40) {
          return true;
        }
      }

      // 3. Document scroll height expanded significantly
      if (document.body.scrollHeight > 650) {
        return true;
      }

      // 4. URL query parameters indicating search has executed
      if (window.location.search && (
        window.location.search.includes('origin') ||
        window.location.search.includes('destination') ||
        window.location.search.includes('depart')
      )) {
        return true;
      }

      return false;
    }

    function isPopupOrDropdownOpen(maxBottom) {
      // Once flight search is active or tickets are present, this is NOT a dropdown popup
      if (searchActive || hasSearchResults()) return false;

      if (userInteracting) return true;
      if (maxBottom && maxBottom > 220) return true;

      // 1. Any input or select or active element inside search card
      var active = document.activeElement;
      if (active && (active.tagName === 'INPUT' || active.tagName === 'SELECT' || (active.closest && active.closest('#search-card')))) {
        var isSubmit = active.matches && (active.matches('button[type="submit"]') || active.matches('[class*="submit"]') || active.matches('[class*="Submit"]'));
        if (!isSubmit && active !== document.body) {
          return true;
        }
      }

      // 2. Any calendar/suggest/dropdown/return/departure elements present and visible
      var popups = document.querySelectorAll(
        '[class*="Calendar"], [class*="calendar"], [class*="dayCell"], [class*="monthCell"], ' +
        '[class*="Suggest"], [class*="suggest"], [class*="dropdown"], [class*="Dropdown"], ' +
        '[class*="popover"], [class*="Popover"], [class*="modal"], [class*="Modal"], ' +
        '[class*="Departure"], [class*="departure"], [class*="Return"], [class*="return"], ' +
        '[class*="DatePicker"], [class*="datepicker"], [class*="popup"], [class*="Popup"], ' +
        '[role="dialog"], [role="listbox"]'
      );
      for (var i = 0; i < popups.length; i++) {
        var el = popups[i];
        if (el.offsetWidth > 0 && el.offsetHeight > 0) {
          return true;
        }
      }
      return false;
    }

    function getActualContentHeight() {
      var allElements = document.body.getElementsByTagName("*");
      var maxBottom = 0;
      for (var i = 0; i < allElements.length; i++) {
        var child = allElements[i];
        if (child.id === 'widget-wrapper') continue;
        if (child.offsetWidth > 0 && child.offsetHeight > 0) {
          var rect = child.getBoundingClientRect();
          var scrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
          var bottom = rect.bottom + scrollY;
          if (bottom > maxBottom) {
            maxBottom = bottom;
          }
        }
      }

      var resultsLoaded = hasSearchResults();
      var dropdownOpen = isPopupOrDropdownOpen(maxBottom);

      var loader = document.getElementById('instant-search-loader');
      var isLoaderVisible = loader && loader.style.display !== 'none';

      // If dropdown or calendar is open, ensure ample room for full 2-month calendar grid (min 620px)
      if (dropdownOpen && !resultsLoaded) {
        maxBottom = Math.max(maxBottom, 620);
      } else if (isLoaderVisible) {
        // While instant loader is active, maintain comfortable height for skeleton cards
        maxBottom = Math.max(maxBottom, 680);
      } else if (!resultsLoaded) {
        // When idle (dropdown closed and no search results yet):
        // Allow enough height (+16px) so bottom rounded card edge and shadow are never clipped by iframe edge
        var card = document.getElementById('search-card');
        var cardBottom = card ? (card.getBoundingClientRect().bottom + (window.pageYOffset || 0)) : 160;
        maxBottom = Math.max(maxBottom, Math.ceil(cardBottom) + 16);
      }

      // Base minimum card height
      if (maxBottom < 170) {
        maxBottom = 170;
      }

      return {
        height: Math.ceil(maxBottom),
        isDropdownOpen: dropdownOpen,
        hasResults: resultsLoaded || isLoaderVisible
      };
    }

    var lastSentHeight = 0;
    var lastSentDropdownState = null;
    var lastSentResultsState = null;

    function sendHeight(force) {
      var data = getActualContentHeight();
      var height = data.height;
      if (
        force ||
        Math.abs(height - lastSentHeight) > 4 ||
        data.isDropdownOpen !== lastSentDropdownState ||
        data.hasResults !== lastSentResultsState
      ) {
        lastSentHeight = height;
        lastSentDropdownState = data.isDropdownOpen;
        lastSentResultsState = data.hasResults;
        window.parent.postMessage({
          type: 'resize-iframe',
          height: height + 16,
          isDropdownOpen: data.isDropdownOpen,
          hasResults: data.hasResults
        }, '*');
      }
    }

    function fixBuyButtonTargets() {
      // Proactively set target=_blank on all flight partner links in the results
      var links = document.querySelectorAll('#tpwl-tickets a');
      links.forEach(function(link) {
        var href = link.getAttribute('href') || link.href || '';
        if (href && isFlightPartnerRedirect(href)) {
          link.setAttribute('target', '_blank');
          link.setAttribute('rel', 'noopener noreferrer');
        }
      });
    }

    var loaderTextInterval = null;
    function startLoaderTextCycle() {
      if (loaderTextInterval) clearInterval(loaderTextInterval);
      var statusEl = document.getElementById('loader-status-text');
      var subEl = document.getElementById('loader-sub-text');
      if (!statusEl || !subEl) return;

      var steps = [
        {
          status: "Searching 100+ airlines for lowest airfares...",
          sub: "Scanning IndiGo, Air India, Akasa Air, SpiceJet..."
        },
        {
          status: "Comparing direct flight tariffs & seat availability...",
          sub: "Checking cabin baggage allowances & zero hidden fee routes..."
        },
        {
          status: "Organizing verified flight deals by price & duration...",
          sub: "Finalizing live airline seat confirmation rates..."
        }
      ];
      var stepIdx = 0;
      loaderTextInterval = setInterval(function() {
        stepIdx = (stepIdx + 1) % steps.length;
        statusEl.textContent = steps[stepIdx].status;
        subEl.textContent = steps[stepIdx].sub;
      }, 1100);
    }

    function checkRealTicketsLoaded() {
      var realTickets = document.querySelectorAll('#tpwl-tickets [class*="ticket"], #tpwl-tickets [class*="Ticket"], #tpwl-tickets [class*="result"], #tpwl-tickets [class*="Result"]');
      if (realTickets.length > 0) {
        var loader = document.getElementById('instant-search-loader');
        if (loader && loader.style.display !== 'none') {
          loader.style.display = 'none';
          if (loaderTextInterval) clearInterval(loaderTextInterval);
          sendHeight(true);
        }
        var btn = document.querySelector('button[type="submit"], [class*="submit"], [class*="Submit"]');
        if (btn && btn.dataset && btn.dataset.origText) {
          var btnSpan = btn.querySelector('span') || btn;
          btnSpan.textContent = btn.dataset.origText;
          btn.style.opacity = '1';
        }
      }
    }

    function handleDOMChange() {
      disableHotelsCheckbox();
      hideHotelsCheckbox();
      fixFormTarget();
      fixLinkTargets();
      fixBuyButtonTargets();
      checkRealTicketsLoaded();
      sendHeight();
    }

    // Immediate expand on click or focus inside search form
    document.addEventListener('focusin', function(e) {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'BUTTON')) {
        var isSubmit = e.target.matches && (e.target.matches('button[type="submit"]') || e.target.matches('[class*="submit"]'));
        if (!isSubmit && e.target.closest('#search-card')) {
          userInteracting = true;
        }
        sendHeight(true);
      }
    }, true);

    document.addEventListener('click', function(e) {
      var isSubmit = e.target && (
        e.target.closest('button[type="submit"]') ||
        e.target.closest('[class*="submit"]') ||
        e.target.closest('[class*="Submit"]') ||
        (e.target.textContent && e.target.textContent.toLowerCase().includes('search flight'))
      );
      if (isSubmit) {
        searchActive = true;
        userInteracting = false;

        // 1. Instantly display animated loader & skeleton cards
        var loader = document.getElementById('instant-search-loader');
        if (loader) {
          loader.style.display = 'block';
          startLoaderTextCycle();
        }

        // 2. Instant button feedback
        var btn = isSubmit;
        if (btn) {
          btn.style.opacity = '0.9';
          var btnSpan = btn.querySelector('span') || btn;
          if (btnSpan && !btn.dataset.origText) {
            btn.dataset.origText = btnSpan.textContent;
            btnSpan.textContent = 'Searching...';
          }
        }

        // 3. Notify parent to immediately push downstream section down
        try {
          window.parent.postMessage({ type: 'flight-search-started' }, '*');
        } catch(err) {}

        sendHeight(true);
        setTimeout(function() { sendHeight(true); }, 50);
        setTimeout(function() { sendHeight(true); }, 200);
        setTimeout(function() { sendHeight(true); }, 500);
        setTimeout(function() { sendHeight(true); }, 1200);
        return;
      }

      // Any click inside the widget (inputs, dates, arrows, autocomplete) keeps interacting state active
      userInteracting = true;
      if (userInteractingTimeout) clearTimeout(userInteractingTimeout);
      userInteractingTimeout = setTimeout(function() {
        if (!isPopupOrDropdownOpen()) {
          userInteracting = false;
          sendHeight(true);
        }
      }, 45000);

      sendHeight(true);
      setTimeout(function() { sendHeight(true); }, 50);
      setTimeout(function() { sendHeight(true); }, 150);
      setTimeout(function() { sendHeight(true); }, 350);
    }, true);

    // Parent can notify iframe to close dropdown when clicking outside
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'close-dropdown') {
        userInteracting = false;
        sendHeight(true);
      }
    });

    window.addEventListener('load', handleDOMChange);
    window.addEventListener('resize', handleDOMChange);
    
    var observer = new MutationObserver(handleDOMChange);
    observer.observe(document.body, { childList: true, subtree: true, attributes: true });

    setInterval(handleDOMChange, 400);
  </script>
